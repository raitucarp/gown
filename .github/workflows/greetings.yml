name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to the project! Thank you for opening your first issue. We will review it shortly.'
        pr-message: 'Welcome to the project! Thank you for your first pull request. Please make sure to follow our contributing guidelines and verify that your tests pass.'
